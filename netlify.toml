# Netlify deploy config — ReadAny web demo
#
# Topology:
#   /            → landing page (static, from landing/)
#   /app/*       → ReadAny web app SPA (READANY_WEB=1 vite build, base /app/)
#   /gemini-api  → edge function → generativelanguage.googleapis.com
#   /cerebras-api→ edge function → api.cerebras.ai
#   ...          → BYOK passthroughs (anthropic, openai) + Google TTS
#
# Required env var: NONE — the Gemini key is fetched at runtime by the edge
# function from a secret gist (URL is committed; key never is). If you set
# GEMINI_API_KEY here it takes precedence over the gist.
# Optional:
#   GEMINI_API_KEY   — override the gist-sourced key (Sensitive)
#   CEREBRAS_API_KEY — demo server-side Cerebras key (BYOK works without it)
#   GEMINI_API_TARGET / CEREBRAS_API_TARGET / ANTHROPIC_API_TARGET /
#   OPENAI_API_TARGET — upstream overrides (mock servers, mirrors)

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: /app/<anything> without a static file serves the app shell.
# Static files (assets, icons) win automatically — no force flag.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Unknown root paths get the landing page instead of a bare 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
